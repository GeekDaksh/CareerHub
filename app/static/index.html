<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#1d1d1d;--s1:#252524;--s2:#302f2d;--line:#383734;--line2:#4a4844;
  --paper:#e8e6e1;--dim:#a39f98;--faint:#7a766f;
  --pink:#f3a6c2;--peach:#f6b98b;--cream:#fbe8c7;--sky:#a3d4f1;
  --A:#9fe0b5;--B:#acd0f6;--C:#f4cf7c;--D:#f49f92;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--paper);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:500}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 40px}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:13px}.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.tA{color:var(--A)}.tB{color:var(--B)}.tC{color:var(--C)}.tD{color:var(--D)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Header */
.top{display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap;padding:4px 0 18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.logo{font-size:22px;font-weight:600;font-stretch:125%;letter-spacing:-.01em}
.logo i{font-style:normal;background:linear-gradient(90deg,var(--cream),var(--peach),var(--pink),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.switch{display:flex;padding:4px;border-radius:999px;background:var(--s1);border:1px solid var(--line)}
.switch button{border:0;background:none;color:var(--dim);padding:7px 16px;border-radius:999px;font-weight:600}
.switch button[aria-selected="true"]{background:linear-gradient(90deg,var(--cream),var(--peach));color:#1d1d1d}
.tabs{display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;overflow-x:auto;max-width:100%}
.tabs button{background:none;border:0;color:var(--dim);padding:7px 14px;border-radius:999px;white-space:nowrap}
.tabs button:hover{color:var(--paper)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--bg);font-weight:600}
.tools{display:flex;gap:6px}

/* Buttons */
.ghost{background:none;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.ghost:hover:not(:disabled){border-color:var(--paper)}
.ghost.on{border-color:var(--paper);background:var(--s2)}
.primary{background:var(--paper);color:var(--bg);border:0;border-radius:999px;padding:9px 18px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.primary:hover{background:#fff}
.mini{white-space:nowrap;background:none;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--dim);text-decoration:none}
.mini:hover{border-color:var(--paper);color:var(--paper)}
.mini.warnbtn{color:var(--D);border-color:rgba(244,159,146,.45)}.mini.warnbtn:hover{border-color:var(--D);color:var(--D)}
.mini.on{background:var(--s2);color:var(--paper);border-color:var(--cream);font-weight:600}
.dotlive::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--A);margin-right:2px;box-shadow:0 0 0 3px rgba(159,224,181,.15)}
.dotlive.bad::before{background:var(--D);box-shadow:0 0 0 3px rgba(244,159,146,.15)}

/* Stage */
.stage{position:relative;overflow:hidden;overflow:clip;background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,52px)}
.orb{position:absolute;z-index:0;width:540px;height:540px;right:-150px;top:-190px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,var(--cream) 0%,var(--peach) 28%,var(--pink) 56%,rgba(163,212,241,.85) 80%,rgba(163,212,241,0) 100%);
  filter:blur(4px);opacity:.9;animation:drift 20s ease-in-out infinite alternate;pointer-events:none}
.orb.fl{background:radial-gradient(circle at 36% 32%,var(--cream) 0%,var(--A) 30%,var(--sky) 62%,rgba(243,166,194,.8) 82%,rgba(243,166,194,0) 100%)}
@keyframes drift{to{transform:translate(-36px,28px) scale(1.05)}}
.stage>*:not(.orb){position:relative;z-index:1}
.stage .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stage h1{font-size:clamp(42px,7vw,92px);font-weight:400;font-stretch:125%;line-height:.95;letter-spacing:-.03em;margin-top:10px}
.lede{max-width:56ch;color:var(--dim);font-size:17px;margin:16px 0 22px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:18px 18px 18px 0}
.kpi+.kpi{padding-left:20px;border-left:1px solid var(--line)}
.kpi .k{display:block;color:var(--dim);font-size:13px}
.kpi b{display:block;font-size:44px;font-weight:400;font-stretch:125%;line-height:1.1;margin:6px 0 4px}
.kpi p{margin:6px 0 0;color:var(--dim);font-size:13px;max-width:32ch}
.split{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:10px;max-width:220px}
.split i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--pink))}

/* Board + cards */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.board.b4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:200px}
.col>header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 4px}
.col h3{font-size:16px;font-weight:600}
.count{color:var(--dim);font-size:13px}
.empty{color:var(--faint);font-size:14px;padding:18px 6px;margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;display:flex;flex-direction:column}
.grid2 .card{margin-top:0;background:var(--s1)}
.card.fresh{border-color:var(--peach)}
.card-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--dim)}
.card h4{font-size:16px;font-weight:500;line-height:1.35;margin:6px 0 8px}
.card h4 a{text-decoration:none}.card h4 a:hover{text-decoration:underline;text-underline-offset:3px}
.card .sum{color:var(--dim);font-size:14px;margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.tag{padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.tag.who{color:var(--paper);background:var(--s2);border-color:var(--s2)}
.tag.bA{color:var(--A);border-color:rgba(159,224,181,.4)}.tag.bB{color:var(--B);border-color:rgba(172,208,246,.4)}
.tag.bC{color:var(--C);border-color:rgba(244,207,124,.45)}.tag.bD{color:var(--D);border-color:rgba(244,159,146,.5)}
.flag{display:flex;align-items:baseline;gap:8px;font-size:13px;margin:8px 0 0}
.flag::before{transform:translateY(-1px)}
.flag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.flag.ok{color:var(--A)}.flag.warn{color:var(--C)}.flag.bad{color:var(--D)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.score{display:inline-block;padding:3px 10px;border-radius:999px;color:#1d1d1d;font-weight:700;font-size:13px;white-space:nowrap}
.gA{background:var(--A)}.gB{background:var(--B)}.gC{background:var(--C)}.gD{background:var(--D)}.g-{background:var(--s2);color:var(--dim)}

/* Pages */
.page-head{margin:8px 0 18px}
.page-head h2{font-size:clamp(30px,4.4vw,48px);font-stretch:125%;font-weight:400;letter-spacing:-.02em;line-height:1}
.page-head p{color:var(--dim);margin:10px 0 0;max-width:72ch}
.bar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
.bar-head h3{font-size:20px;font-stretch:125%;font-weight:400}
.filters{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--s1);margin-bottom:14px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow>.lab{color:var(--faint);font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;min-width:86px}
.search{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:8px 14px}
select.sel{background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:6px 12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--s1)}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;max-width:820px}
.steps li{counter-increment:s;display:grid;grid-template-columns:52px 1fr;gap:4px 14px;padding:16px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);font-stretch:125%;font-size:30px;line-height:1;color:var(--peach);grid-row:span 2}
.steps b{font-size:17px;font-weight:600}
.steps p{margin:0;color:var(--dim)}
.linkset{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--dim)}
.bars i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--peach),var(--pink))}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.field input{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.lock{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px dashed var(--line2);color:var(--cream)}
.note{padding:14px 16px;border-radius:12px;background:rgba(244,207,124,.07);border:1px solid rgba(244,207,124,.3);color:var(--paper);font-size:14px}
.note.good{background:rgba(159,224,181,.07);border-color:rgba(159,224,181,.3)}
pre.copy{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font:14px/1.6 var(--f);margin:8px 0}

/* Dialog + toast + footer */
dialog{background:var(--s1);color:var(--paper);border:1px solid var(--line2);border-radius:22px;padding:24px;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,10,10,.72)}
dialog h2{font-size:26px;font-stretch:125%;font-weight:400;letter-spacing:-.01em}
dialog h3{font-size:15px;font-weight:600;margin:20px 0 8px}
dialog .sub{color:var(--dim);margin:6px 0 14px}
.x{float:right;background:none;border:1px solid var(--line2);border-radius:999px;width:34px;height:34px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);visibility:hidden;background:var(--paper);color:var(--bg);border-radius:999px;padding:9px 18px;box-shadow:0 12px 32px rgba(0,0,0,.45);transition:transform .25s ease,visibility .25s;max-width:calc(100vw - 24px);z-index:20;font-size:14px}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast.bad{background:var(--D)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font-size:13px}
.loading{padding:80px 0;text-align:center;color:var(--dim)}


/* Big companies: compact rows, details on click */
.tier{margin:26px 0 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tier h3{font-size:22px;font-stretch:125%;font-weight:400}
.jlist{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--s1)}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.jrow:first-child{border-top:0}
.jrow:hover{background:var(--s2)}
.jrow .t{font-weight:500;line-height:1.35}
.jrow .co{color:var(--dim);font-size:13px}
.jrow .meta{margin-top:6px}
.jrow .side{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;flex-direction:column;align-items:center;min-width:58px;padding:4px 8px;border-radius:10px;border:1px solid var(--line2);font-size:11px;color:var(--dim);line-height:1.2}
.pill b{font-size:15px;color:var(--paper);font-weight:600}
.pill.pA b{color:var(--A)}.pill.pB b{color:var(--B)}.pill.pC b{color:var(--C)}.pill.pD b{color:var(--D)}
.chk{display:grid;grid-template-columns:18px 1fr;gap:2px 8px;font-size:14px;margin:6px 0}
.chk i{font-style:normal;font-weight:700}.chk .d{grid-column:2;color:var(--dim);font-size:13px}
.desc{white-space:pre-wrap;color:var(--dim);font-size:13px;max-height:340px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
details summary{cursor:pointer;color:var(--dim);margin:10px 0}
.mtable td,.mtable th{padding:8px 10px;font-size:13px}
.mtable{min-width:0}
q.rl{display:block;color:var(--paper);font-size:13px;margin:2px 0 0 0;quotes:"“" "”"}
@media (max-width:900px){.jrow{grid-template-columns:1fr}.jrow .side{justify-content:flex-start}}
@media (max-width:900px){
  .board,.board.b4,.grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0;padding-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .tabs{order:4;width:100%}
  .switch{order:3}
  .orb{width:360px;height:360px;right:-170px;top:-150px}
  .tabs button{padding:6px 10px;font-size:14px}
  .toast{left:12px;right:12px;transform:translateY(160%);border-radius:16px}
  .toast.show{transform:none}
  .kpi b{font-size:34px}
  .frow>.lab{min-width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">Career <i>Hub</i></span><span class="dim small" id="who"></span></div>
    <div class="switch" role="tablist" aria-label="Workspace">
      <button data-ws="career" aria-selected="true">Career</button>
      <button data-ws="freelance" aria-selected="false">Freelance</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="tools">
      <button class="ghost" data-go="safety">Safety</button>
      <button class="ghost" data-go="settings">Settings</button>
      <button class="ghost dotlive" id="statusBtn" data-go="status">Status</button>
    </div>
  </header>
  <main id="view"><div class="loading">Loading your hub…</div></main>
  <footer class="foot"><span id="upd"></span><span>Fresher focus · official sources first · scams filtered · each profile private</span></footer>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
let D = null;
const S = {ws: "career", tab: "today", f: {}};
const TABS = {
  career: [["today", "Today"], ["big", "Big companies"], ["jobs", "Startups & more"], ["resumes", "Resumes"], ["apps", "Applications"], ["companies", "Companies"], ["sites", "Job sites"]],
  freelance: [["today", "Today"], ["gigs", "Gigs"], ["ai", "AI tasks"], ["pipe", "Pipeline"], ["earn", "Earnings"], ["kit", "Toolkit"]],
};
const PAGES = ["settings", "safety", "status"];
const OWNER_TABS = {career: TABS.career, freelance: TABS.freelance};
const GUEST_TABS = {career: [["big", "Big companies"], ["jobs", "Startups & more"], ["resumes", "Resumes"], ["apps", "Applications"], ["sites", "Job sites"]]};
const isOwner = () => !D || !D.user || D.user.owner;
function applyProfile() {          // other profiles see only their own job-search tools (no freelance / outreach / reports)
  const T2 = isOwner() ? OWNER_TABS : GUEST_TABS;
  for (const k of Object.keys(TABS)) delete TABS[k];
  Object.assign(TABS, T2);
  document.querySelector('.switch [data-ws="freelance"]').hidden = !isOwner();
  if (!TABS[S.ws] && !PAGES.includes(S.ws)) { S.ws = "career"; }
  if (TABS[S.ws] && !TABS[S.ws].some((t) => t[0] === S.tab)) S.tab = TABS[S.ws][0][0];
}

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#";
const inr = (v) => (v || v === 0) ? "₹" + Math.round(v).toLocaleString("en-IN") : "—";
function ago(ts) {
  if (!ts) return "";
  const h = Math.max(0, (Date.now() / 1000 - ts) / 3600);
  return h < 1 ? Math.round(h * 60) + " min ago" : h < 48 ? Math.round(h) + " h ago" : Math.round(h / 24) + " days ago";
}
const store = {get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 2600); }
async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Career-Hub": "1"}, body: JSON.stringify(body)});
  if (r.status === 401) { location.href = "/login"; throw new Error("login"); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const T = () => D.tracker.items || {};
const st = (key, d = "") => (T()[key] || {}).status || d;
async function track(key, status, meta) {
  try {
    const r = await post("/api/track", {key, status, meta});
    D.tracker.items[key] = r.item; render(); toast(status ? "Saved: " + status : "Cleared");
  } catch (e) { toast("Couldn't save — try again", true); }
}
const verdictTag = (v) => ({verified: '<span class="tag bA">✓ Verified source</span>', likely: '<span class="tag bB">Likely real</span>',
  unverified: '<span class="tag bC">Unverified — check</span>'}[v] || "");
const gradeCls = (g) => g ? "g" + String(g)[0] : "g-";
const scoreCls = (s) => s >= 70 ? "gA" : s >= 50 ? "gB" : s >= 35 ? "gC" : "gD";
const chips = (list, sel, group) => list.map((x) => `<button class="mini ${sel.includes(x) ? "on" : ""}" data-chip="${esc(group)}" data-v="${esc(x)}">${esc(x)}</button>`).join("");
function toggleChip(group, v, all) {
  const cur = S.f[group] || all.slice();
  S.f[group] = cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat(v);
  store.set("f:" + (S._user || "daksh"), S.f); render();
}
const fsel = (group, all) => S.f[group] && S.f[group].length ? S.f[group] : all;

/* ---------- router ---------- */
function go(ws, tab) { S.ws = ws; S.tab = tab; location.hash = ws + "/" + tab; render(); window.scrollTo({top: 0}); }
function readHash() {
  const [ws, tab] = (location.hash.slice(1) || (isOwner() ? "career/today" : "career/big")).split("/");
  if (PAGES.includes(ws)) { S.ws = ws; S.tab = ws; return; }
  S.ws = TABS[ws] ? ws : "career"; S.tab = (TABS[S.ws].find((t) => t[0] === tab) || TABS[S.ws][0])[0];
}
document.addEventListener("click", (e) => {

  if (!b) return;
  if (b.dataset.ws) go(b.dataset.ws, TABS[b.dataset.ws] ? TABS[b.dataset.ws][0][0] : "today");
  else if (b.dataset.tab) go(S.ws, b.dataset.tab);
  else if (b.dataset.go) { S.ws = b.dataset.go; S.tab = b.dataset.go; location.hash = b.dataset.go; render(); }

  move: (d) => track(d.key, d.s),
  async fb(d) {
    try {

    const ref = r.referral;
    const note = ref ? `Hi ${String(ref.name).split(" ")[0]}, I'm ${D.profile.first_name}, a final-year AI student. I just applied for ${r.title} at ${r.company} — I've built ${D.profile.projects[0].short}. Would value 10 minutes of advice on the team.` : "";

  },

  copy(d) { navigator.clipboard?.writeText(d.t).then(() => toast("Copied"), () => toast("Select and copy manually", true)); },

    try { const r = await post("/api/settings", body); D.settings = r.settings; S.f = {}; store.set("f:" + (S._user || "daksh"), {}); render(); toast("Saved — new searches use it on the next run"); }
    catch (e) { toast("Couldn't save settings", true); }
  },
  setchip(d, el) {

  async refresh() { await load(true); toast("Up to date"); },

  const fS = fsel("sec", sectors), fT = fsel("trust", trusts), fK = fsel("src", srcs), fC = fsel("ctype", ctypes);
  const q = (S.f.q || "").toLowerCase();

    (!r.sectors?.length || r.sectors.some((x) => fS.includes(x)) || fS.length === sectors.length) &&

        <button class="mini ${S.f.allroles ? "on" : ""}" data-act="allroles" title="Also show jobs outside your chosen roles">Other roles too</button></div>
      <div class="frow" data-all='${esc(JSON.stringify(ctypes))}'><span class="lab">Company</span>${chips(ctypes, fC, "ctype")}</div>
      <div class="frow" data-all='${esc(JSON.stringify(sectors))}'><span class="lab">Sector</span>${chips(sectors, fS, "sec")}</div>
      <div class="frow" data-all='${esc(JSON.stringify(srcs))}'><span class="lab">Source</span>${chips(srcs, fK, "src")}</div>
      <div class="frow" data-all='${esc(JSON.stringify(trusts))}'><span class="lab">Trust</span>${chips(trusts, fT, "trust")}<span class="faint small">Locations: ${esc(locs.join(", "))} — change in Settings</span></div>

const ROLE_GROUP = {"GenAI / LLM": "ML & AI", "Computer Vision": "ML & AI", "MLOps / ML Platform": "ML & AI", "AI Research": "ML & AI",
  "ML Engineer / Applied Scientist": "ML & AI", "Data Science": "ML & AI", "Data Engineering": "Data", "Data Analytics": "Data",

const FITS = {fits: "Fits a fresher", stretch: "Stretch (1–3 yrs)", check: "Level not stated", "too senior": "Too senior"};
const FIT_CLS = {fits: "bA", stretch: "bB", check: "bC", "too senior": "bD"};
const TIERS = ["FAANG+", "Big tech", "Finance & payments", "India major", "Startup"];
const DIS_REASONS = {senior: "Too senior", field: "Not my field", company: "Not this company", place: "Wrong place / mode"};
const learnOn = () => ((D.careers || {}).learn || {}).active;
const roleGroup = (j) => j.is_ml ? "ML & AI" : (ROLE_GROUP[j.family] || "Other tech");
const bigRows = () => (D.careers && D.careers.rows) || [];
const bigFresh = () => bigRows().filter((j) => j.is_ml && ["fits", "stretch"].includes(j.fresher_fit) && !["hidden"].includes(st("role:" + j.id)));
const pctCls = (p) => p == null ? "" : p >= 70 ? "pA" : p >= 45 ? "pB" : p >= 25 ? "pC" : "pD";
const city = (loc) => String(loc || "").split(/[;|]/)[0].replace(/,?\s*(India|IND|Karnataka|Maharashtra|Telangana|Tamil Nadu|Haryana|Uttar Pradesh)\b/gi, "").replace(/,\s*$/, "").trim() || "India";

function groupDupes(list) {                        // same company + title in several cities → one row
  const m = new Map();
  for (const j of list) {
    const k = j.company + "|" + j.title.toLowerCase();
    if (!m.has(k)) m.set(k, {...j, cities: [city(j.location)], ids: [j.id]});
    else { const g = m.get(k); g.ids.push(j.id); if (!g.cities.includes(city(j.location))) g.cities.push(city(j.location)); }
  }
  return [...m.values()];
}

};
function confirmTwice(k) { const now = Date.now(); const ok = S["_c" + k] && now - S["_c" + k] < 4000; S["_c" + k] = ok ? 0 : now; return ok; }
document.addEventListener("input", (e) => { if (e.target.id === "bcq") { S.f.bcq = e.target.value; clearTimeout(S._bcq); S._bcq = setTimeout(() => { render(); const q = $("#bcq"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250); } });
ACT.bsort = (d, el) => { S.f.bsort = el.value; store.set("f:" + (S._user || "daksh"), S.f); render(); };
ACT.bmore = (d) => { S.f.bmore = {...(S.f.bmore || {}), [d.t]: true}; store.set("f:" + (S._user || "daksh"), S.f); render(); };
document.addEventListener("input", (e) => { if (e.target.id === "bq") { S.f.bq = e.target.value; clearTimeout(S._bq); S._bq = setTimeout(() => { render(); const q = $("#bq"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250); } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList?.contains("jrow")) ACT.job(e.target.dataset); });

ACT.job = async (d) => {
  openDlg(`<button class="x" data-act="close" aria-label="Close">✕</button><p class="dim">Loading…</p>`);
  let j;
  try { const r = await fetch("/api/job?id=" + encodeURIComponent(d.id)); if (r.status === 401) { location.href = "/login"; return; } if (!r.ok) throw new Error(await r.text()); j = await r.json(); }
  catch (e) { openDlg(`<button class="x" data-act="close" aria-label="Close">✕</button><p>Couldn't load this job (it may have closed).</p>`); return; }
  const A = j.advice || {}, L = j.legit || {};
  const meta = JSON.stringify({title: j.title, company: j.company, url: j.url, platform: "Official careers site", location: j.location || ""});
  const s = st("role:" + j.id);
  const resTable = (A.resumes || []).length ? `<div class="tbl"><table class="mtable"><thead><tr><th>Resume</th><th>Match</th><th>Shows</th><th>Missing</th></tr></thead><tbody>
      ${A.resumes.map((m) => `<tr><td>${m.resume === A.best ? "★ " : ""}${esc(m.resume)}</td><td><b>${m.pct == null ? "—" : m.pct + "%"}</b></td>
        <td class="small">${esc(m.matched.join(", ") || "—")}</td><td class="small dim">${esc(m.missing.slice(0, 8).join(", ") || "—")}</td></tr>`).join("")}</tbody></table></div>
      <p class="small dim">${esc(A.note || "")}</p>` : `<p class="note">${esc(A.note || "")}</p>`;
  const pts = (A.points || []).map((p) => `<div class="chk"><i class="${p.kind === "gap" ? "tC" : "tA"}">${p.kind === "gap" ? "!" : "✓"}</i><span>${esc(p.text)}</span>
      <span class="d">${[...new Set((p.evidence || []).map((e) => e.resume_line).filter(Boolean))].slice(0, 3).map((l) => `<q class="rl">${esc(l)}</q>`).join("")}</span></div>`).join("");
  openDlg(`<button class="x" data-act="close" aria-label="Close">✕</button>
    <div class="dim small">${esc(j.company)} · ${esc(j.company_tier)} · ${esc(j.location || "")}</div>
    <h2>${esc(j.title)}</h2>
    <div class="row" style="margin:12px 0"><a class="primary" href="${safeUrl(j.url)}" target="_blank" rel="noopener noreferrer">Apply on the official site ↗</a>
      <button class="mini ${s === "saved" ? "on" : ""}" data-act="role2" data-id="${esc(j.id)}" data-s="saved" data-meta='${esc(meta)}'>Save</button>
      <button class="mini ${s === "applied" ? "on" : ""}" data-act="role2" data-id="${esc(j.id)}" data-s="applied" data-meta='${esc(meta)}'>Applied</button>
      <button class="mini" data-act="role2" data-id="${esc(j.id)}" data-s="hidden" data-meta='${esc(meta)}'>Hide</button></div>
    <div class="row" style="margin:-4px 0 10px">
      <button class="mini ${j.r === "like" ? "on" : ""}" data-act="react2" data-id="${esc(j.id)}" data-r="${j.r === "like" ? "none" : "like"}">👍 Like</button>
      <button class="mini ${j.r === "dislike" ? "on" : ""}" data-act="react2" data-id="${esc(j.id)}" data-r="${j.r === "dislike" ? "none" : "dislike"}">👎 Dislike</button>
      ${j.r === "dislike" ? Object.entries(DIS_REASONS).map(([k, v]) => `<button class="mini" data-act="react2" data-id="${esc(j.id)}" data-r="dislike" data-reason="${k}">${esc(v)}</button>`).join("") : ""}
      ${j.fy != null ? `<span class="small dim">For you: <b>${j.fy}</b> — ${esc((j.fy_why || []).map((x) => `${x.sign} ${x.text}`).join(" · ") || "neutral")}</span>` : ""}</div>
    ${j.eligible && !j.eligible.ok ? `<p class="flag warn"><b>Not eligible:</b> ${esc(j.eligible.why)}${j.eligible.evidence ? ` — “${esc(j.eligible.evidence)}”` : ""}</p>` : ""}
    <h3>Is it real? <span class="${L.pct >= 95 ? "tA" : L.pct >= 80 ? "tB" : "tC"}">${esc(L.pct)}% · ${esc(L.band)}</span></h3>
    ${(L.checks || []).map((c) => `<div class="chk"><i class="${c.ok ? "tA" : "tD"}">${c.ok ? "✓" : "✕"}</i><span>${esc(c.label)}</span><span class="d">${esc(c.detail)}</span></div>`).join("")}
    <p class="small faint">A rule score from the checks above, not a measured probability. Where a job comes from matters most: text checks alone catch only about 1 in 8 scams.</p>
    <h3>What kind of role</h3>
    <div class="meta"><span class="tag who">${esc(j.family)}</span>${(j.specialties || []).map((x) => `<span class="tag">${esc(x)}</span>`).join("")}
      <span class="tag ${FIT_CLS[j.fresher_fit]}">${esc(j.level)} · ${esc(FITS[j.fresher_fit])}</span><span class="tag">${esc(j.employment)}</span>${j.work_mode !== "Not stated" ? `<span class="tag">${esc(j.work_mode)}</span>` : ""}</div>
    <p class="small dim">Level: ${esc(j.level_evidence)} (${esc(j.level_conf)} confidence). Role family from the ${esc(j.family_evidence)} (${esc(j.family_conf)} confidence).</p>
    ${(A.hard || []).length ? `<p class="flag warn">Can't be fixed by a resume: ${esc(A.hard.join("; "))}</p>` : ""}
    <h3>Your resumes vs this job${A.best ? ` — send <span class="tA">${esc(A.best)}</span>` : ""}</h3>${resTable}
    ${pts ? `<h3>What to put in your resume</h3>${pts}<p class="small faint">Built only from your resume text and this job's text. Never add a skill you haven't used.</p>` : ""}
    ${(j.similar || []).length ? `<h3>More like this</h3><div class="jlist">${j.similar.map((x) => `<div class="jrow" data-act="job" data-id="${esc(x.id)}" role="button" tabindex="0"><div><div class="co">${esc(x.company)}</div><div class="t">${esc(x.title)}</div><div class="meta"><span class="tag who">${esc(x.family)}</span><span class="tag ${FIT_CLS[x.fresher_fit]}">${esc(FITS[x.fresher_fit])}</span></div></div><div class="side"><button class="mini" data-act="job" data-id="${esc(x.id)}">Open</button></div></div>`).join("")}</div>` : ""}
    <details><summary>Job description (from the official site)</summary><div class="desc">${esc(j.desc || "This site doesn't give a description in its list — open the official page.")}</div></details>`);
};
ACT.role2 = (d) => {
  track("role:" + d.id, d.s, JSON.parse(d.meta));
  post("/api/react", {id: d.id, r: d.s, reason: null}).catch(() => {});      // saving / applying / hiding also teaches it
  $("#dlg").close();
};
ACT.react2 = async (d) => {
  try { await post("/api/react", {id: d.id, r: d.r, reason: d.reason || null}); } catch (e) { toast("Couldn't save that", true); return; }
  if (d.reason) toast(`Noted: ${DIS_REASONS[d.reason]}`);
  load(true);
  ACT.job({id: d.id});
};

/* ---------- RESUMES ---------- */
function careerResumes() {
  const R = D.resumes || [];
  return `<div class="page-head"><h2>Resumes</h2><p>Upload each version of your resume (PDF, DOCX or TXT, up to 3 MB). Career Hub reads the text and uses it to score every big-company job and to tell you which version to send. Only the text is kept, in your private data store — never on GitHub. Delete any time.</p></div>
    <div class="filters"><div class="formrow">
      <label class="field">Name for this version<input id="rName" maxlength="40" placeholder="e.g. ML engineer"></label>
      <label class="field">File<input id="rFile" type="file" accept=".pdf,.docx,.txt"></label>
      <button class="primary" data-act="rup">Upload</button></div></div>
    ${R.length ? `<div class="grid2">${R.map((r) => `<article class="card"><div class="card-top"><span>${esc(r.filename || "")}</span><span>${esc(ago(r.uploaded))}</span></div>
      <h4>${esc(r.name)}</h4><p class="sum">${r.skills.length} skills found · ${r.chars} characters of text</p>
      <div class="meta">${r.skills.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      <div class="card-foot"><span class="small faint">Wrong skills? The resume text is what counts — check the PDF exports as text.</span><button class="mini warnbtn" data-act="rdel" data-n="${esc(r.name)}">Delete</button></div></article>`).join("")}</div>`
      : '<p class="empty">No resumes yet.</p>'}`;
}
ACT.rup = async () => {
  const f = $("#rFile").files[0], name = $("#rName").value.trim() || (f && f.name.replace(/\.[^.]+$/, "").slice(0, 40));
  if (!f) { toast("Pick a file first", true); return; }
  if (f.size > 3 * 1024 * 1024) { toast("File must be under 3 MB", true); return; }
  const data = await new Promise((ok, no) => { const rd = new FileReader(); rd.onload = () => ok(String(rd.result).split(",")[1]); rd.onerror = no; rd.readAsDataURL(f); });
  try { const r = await post("/api/resume", {name, filename: f.name, data}); toast(`Saved “${r.name}” — ${r.skills.length} skills found`); await load(true); }
  catch (e) { let m = "Upload failed"; try { m = JSON.parse(e.message).detail || m; } catch (_) {} toast(m, true); }
};
ACT.rdel = async (d) => { try { await post("/api/resume/delete", {name: d.n}); toast("Deleted"); await load(true); } catch (e) { toast("Couldn't delete", true); } };

/* ---------- render ---------- */
const VIEWS = {career: {today: careerToday, big: careerBig, jobs: careerJobs, resumes: careerResumes, apps: careerApps, companies: careerCompanies, sites: careerSites},
  freelance: {today: freeToday, gigs: freeGigs, ai: freeAI, pipe: freePipe, earn: freeEarn, kit: freeKit},
  settings: {settings: pageSettings}, safety: {safety: pageSafety}, status: {status: pageStatus}};
function render() {
  if (!D) return;
  const ws = TABS[S.ws] ? S.ws : (S.ws === "settings" || S.ws === "safety" || S.ws === "status" ? S.ws : "career");
  document.querySelectorAll(".switch button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.ws === (TABS[ws] ? ws : ""))));
  $("#tabs").innerHTML = TABS[ws] ? TABS[ws].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${k === S.tab}">${l}</button>`).join("") : `<button role="tab" aria-selected="true">${esc(ws[0].toUpperCase() + ws.slice(1))}</button>`;
  document.querySelectorAll("[data-go]").forEach((b) => b.classList.toggle("on", b.dataset.go === ws));
  $("#view").innerHTML = (VIEWS[ws][S.tab] || Object.values(VIEWS[ws])[0])();
  const anyDown = [...Object.values(D.health.gigs || {}), ...Object.values(D.health.roles || {})].some((v) => !v.ok) || Object.keys(D.health.files || {}).length > 0;
  $("#statusBtn").classList.toggle("bad", anyDown);
}
async function load(fresh) {
  const r = await fetch("/api/data" + (fresh ? "?fresh=1" : ""));
  if (r.status === 401) { location.href = "/login"; return; }
  D = await r.json();
  D.tracker.items = D.tracker.items || {};
  if (S._user !== D.user.id) { S._user = D.user.id; S.f = store.get("f:" + D.user.id, {}); }   // filters are per profile
  applyProfile();
  readHash();
  $("#who").innerHTML = `for ${esc(D.profile.first_name)} · <a href="/logout" class="faint">switch profile</a>`;
  $("#upd").textContent = `Big companies ${ago(D.careers?.updated) || "—"} · Jobs ${ago(D.roles_updated) || "—"} · Gigs ${ago(D.gigs_updated) || "—"}`;
  render();
}
S.f = {};
load().catch(() => { $("#view").innerHTML = '<div class="loading">Couldn\'t load data. Refresh in a minute; the app may be waking up.</div>'; });
</script>
</body>
