name: Probe careers sites
# Run by hand: tests each candidate company's careers site from GitHub's servers and reports what works.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (Node 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m careers.probe
        env:
          PYTHONUNBUFFERED: "1"
