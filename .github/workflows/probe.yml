name: Probe careers sites
# Run by hand. "probe": tests each candidate company's careers site from GitHub's servers.
# "dump": saves a full sample of public job posts to the probe-data branch (for building and testing the classifier).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe, dump or explore
        default: probe
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write          # only used by "dump" to push the sample to the probe-data branch; no secrets here
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (Node 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - if: inputs.mode == 'probe'
        run: python -m careers.probe
        env:
          PYTHONUNBUFFERED: "1"
      - if: inputs.mode == 'explore'
        run: python -m careers.explore
        env:
          PYTHONUNBUFFERED: "1"
      - if: inputs.mode == 'dump'
        run: |
          python -m careers.probe --dump sample/jobs.jsonl
          git config user.name "careerhub-bot"; git config user.email "careerhub-bot@users.noreply.github.com"
          git checkout --orphan probe-data
          git rm -rq --cached .
          git add sample/jobs.jsonl
          git commit -qm "job sample $(date -u +%F)"
          git push -f origin probe-data
        env:
          PYTHONUNBUFFERED: "1"
