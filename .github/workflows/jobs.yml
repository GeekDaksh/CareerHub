name: Job finder
# Twice a week (Mon + Thu 03:00 IST): new startups, profiles, people, work emails, outreach plan.
on:
  schedule:
    - cron: "30 21 * * 0,3"
  workflow_dispatch:
concurrency:
  group: job-finder
  cancel-in-progress: false
permissions:
  contents: read      # the job that holds the API keys can't push to the repo
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_DIR: data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      TOMBA_KEY: ${{ secrets.TOMBA_KEY }}
      TOMBA_SECRET: ${{ secrets.TOMBA_SECRET }}
      ZEROBOUNCE_API_KEY: ${{ secrets.ZEROBOUNCE_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m common.hfstore pull
      - name: Run job finder
        run: python jobs/pipeline.py
      - name: Save (also saves partial progress if a step failed)
        if: always()
        run: python -m common.hfstore push jobs
  heartbeat:
    # GitHub pauses schedules in repos with no commits for 60 days. This tiny job commits a date stamp.
    # It is the only job with write access, and it gets no API keys.
    needs: pipeline
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Heartbeat (keeps the schedule alive)
        run: |
          mkdir -p status
          date -u +"last job-finder run: %Y-%m-%d %H:%M UTC" > status/heartbeat.txt
          git config user.name "career-hub-bot"
          git config user.email "career-hub-bot@users.noreply.github.com"
          git add status/heartbeat.txt
          git commit -m "heartbeat" || true
          git push || true
