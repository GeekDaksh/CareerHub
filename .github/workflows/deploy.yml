name: Deploy app
# Runs when the app or settings change, or by hand. Creates the private HF Space + dataset if missing.
on:
  push:
    branches: [main]
    paths: ["app/**", "config.py", "common/**", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (Node 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.30"
      - run: python deploy/deploy_space.py
