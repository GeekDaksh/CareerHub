name: Gig + job radar
# 4 times a day (08:15, 14:15, 20:15, 02:15 IST): freelance gigs, entry-level jobs, big companies' careers sites.
# The 08:15 run also sends the morning email.
on:
  schedule:
    - cron: "45 2,8,14,20 * * *"
  workflow_dispatch:
concurrency:
  group: gig-radar
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_DIR: data
      PYTHONUNBUFFERED: "1"      # show each source's result live in the run log
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      APP_URL: ${{ vars.APP_URL }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (Node 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make sure the private data store exists
        run: python deploy/deploy_space.py --ensure
      - run: python -m common.hfstore pull
      - name: Learn from your feedback (versioned, tested lessons)
        run: python -m common.feedback learn
        continue-on-error: true
      - name: Find gigs
        run: python -m gigs.radar
      - name: Find entry-level jobs (alerts, careers pages, boards, job pages)
        run: python -m roles.radar
        continue-on-error: true
      - name: Big companies' own careers sites (FAANG+ first)
        run: python -m careers.run
        continue-on-error: true
      - name: Morning email
        run: python -m notify.digest
        continue-on-error: true
      - name: Save
        if: always()
        run: |
          python -m common.hfstore push gigs
          python -m common.hfstore push roles
          python -m common.hfstore push lessons
          python -m common.hfstore push careers
