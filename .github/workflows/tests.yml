name: Tests
# Runs every test on each push, so a broken change shows a red mark on GitHub before it can reach the app.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (Node 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r app/requirements.txt httpx
      - run: bash eval/fetch_emscad.sh
      - run: bash tests/run_all.sh
