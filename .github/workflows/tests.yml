name: Tests
# Runs every test on each push, so a broken change shows a red mark on GitHub before it can reach the app.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r app/requirements.txt httpx
      - run: bash eval/fetch_emscad.sh
      - run: bash tests/run_all.sh
